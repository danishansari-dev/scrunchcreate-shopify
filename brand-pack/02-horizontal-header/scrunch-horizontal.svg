<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,700&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
      .serif-main { font-family: 'Playfair Display', Didot, 'Bodoni MT', Georgia, serif; font-weight: 800; fill: #1a1817; }
      .ampersand { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 700; fill: #8c766b; }
      .tagline { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.26em; fill: #24201e; text-anchor: middle; text-transform: uppercase; }
      .tagline-line { stroke: #8c766b; stroke-width: 1.5; stroke-linecap: round; }
    </style>
    <linearGradient id="ribbonHGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4BAB4"/>
      <stop offset="35%" stop-color="#E39793"/>
      <stop offset="70%" stop-color="#D17A7D"/>
      <stop offset="100%" stop-color="#ECA7A3"/>
    </linearGradient>
    <filter id="ribbonShadowH" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#2a1f1d" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Horizontal Wordmark: Scrunch & Create -->
  <text x="50" y="145" class="serif-main" font-size="140" letter-spacing="-0.03em">Scrunch</text>
  <text x="550" y="145" class="ampersand" font-size="120">&amp;</text>
  <text x="655" y="145" class="serif-main" font-size="140" letter-spacing="-0.02em">Create</text>

  <!-- Flowing Silk Ribbon Accent across Header -->
  <path d="M 520 120 C 560 60, 680 70, 720 100 C 760 130, 880 120, 920 90 C 940 75, 910 65, 870 75 C 800 90, 700 115, 630 125 C 570 132, 510 120, 520 120 Z" 
        fill="url(#ribbonHGradient)" 
        filter="url(#ribbonShadowH)"
        opacity="0.95"/>

  <!-- Divider Rules and Tagline -->
  <line x1="120" y1="195" x2="380" y2="195" class="tagline-line"/>
  <text x="600" y="201" class="tagline">Created to Make You Shine</text>
  <line x1="820" y1="195" x2="1080" y2="195" class="tagline-line"/>
</svg>
